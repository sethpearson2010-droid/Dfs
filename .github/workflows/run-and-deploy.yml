name: Run pipeline and deploy dashboard

# Triggered manually from the Actions tab (works fine from a phone
# browser — GitHub's mobile web UI supports workflow_dispatch inputs,
# though the "Run workflow" dropdown renders more reliably with
# desktop-site mode toggled on in Chrome). This lets the whole
# pipeline run without ever opening a terminal on the phone: replace
# inputs/salary.csv with this week's FanDuel export (via the GitHub
# web file editor), trigger this workflow, then open the Pages URL.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season year, e.g. 2026"
        required: true
        default: "2026"
      risk_scale:
        description: "1 = safest/cash, 10 = riskiest/max GPP. Every lineup this run builds uses EXACTLY this level — independent of num_lineups below, no auto-scaling."
        required: false
        default: "5"
      num_lineups:
        description: "How many lineups to build, all at risk_scale above (independent setting — e.g. risk_scale 5 + num_lineups 50 builds 50 lineups all at level 5)"
        required: false
        default: "1"
      explore:
        description: "Ignore risk_scale/num_lineups above and instead build one lineup at each of 5 preset risk levels (cash through max GPP)"
        type: boolean
        required: false
        default: false
      risk_level:
        description: "Advanced: raw 0.0-1.0 risk level instead of risk_scale above. Ignored unless risk_scale is left blank."
        required: false
        default: ""
      randomness:
        description: "Multiplier on how differentiated a multi-lineup batch is (1.0 = default; >1 wilder, <1 tighter)"
        required: false
        default: "1.0"
      max_player_salary:
        description: "Optional: exclude any player priced above this from consideration entirely (a punt/no-studs build). Leave blank for no cap — this is NOT the total lineup cap, which is always $60,000."
        required: false
        default: ""
      max_salary_leftover:
        description: "Push lineups to spend within this much of the $60,000 cap (default 2000). Best-effort — see README if combined with max_player_salary."
        required: false
        default: "2000"
      skip_redzone:
        description: "Skip the play-by-play red-zone fetch for a faster run"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# only one Pages deployment at a time; a new run supersedes an
# in-flight one rather than queuing behind it
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check salary CSV exists
        run: |
          if [ ! -s inputs/salary.csv ]; then
            echo "::error::inputs/salary.csv is missing or empty. Upload this week's FanDuel export there first."
            exit 1
          fi

      - name: Run pipeline
        run: |
          ARGS="--season ${{ inputs.season }} --salary-csv inputs/salary.csv --output output/players.json"
          if [ "${{ inputs.explore }}" = "true" ]; then
            ARGS="$ARGS --explore"
          else
            if [ -n "${{ inputs.risk_level }}" ]; then
              ARGS="$ARGS --risk-level ${{ inputs.risk_level }}"
            else
              ARGS="$ARGS --risk-scale ${{ inputs.risk_scale }}"
            fi
            ARGS="$ARGS --num-lineups ${{ inputs.num_lineups }} --randomness ${{ inputs.randomness }}"
          fi
          if [ -n "${{ inputs.max_player_salary }}" ]; then
            ARGS="$ARGS --max-player-salary ${{ inputs.max_player_salary }}"
          fi
          if [ -n "${{ inputs.max_salary_leftover }}" ]; then
            ARGS="$ARGS --max-salary-leftover ${{ inputs.max_salary_leftover }}"
          fi
          if [ "${{ inputs.skip_redzone }}" = "true" ]; then
            ARGS="$ARGS --skip-redzone"
          fi
          echo "Running: python -m nfl_dfs.main $ARGS"
          python -m nfl_dfs.main $ARGS

      - name: Assemble static site
        run: |
          mkdir -p site/output
          cp output/*.json site/output/
          # the dashboard normally lives at frontend/index.html and
          # fetches ../output/*.json (one level up) for local use via
          # `python -m http.server`. For a root-level Pages deployment
          # everything is flattened into one folder, so the relative
          # path needs to become a same-directory fetch instead.
          sed 's#\.\./output/#output/#g' frontend/index.html > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
